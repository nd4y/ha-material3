# Example only: replace the entity IDs, actions and labels with your own.
# HA owns navigation and layout; the HACS module supplies individual cards.
title: Material Home
views:
  - title: Home
    path: home
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:ha-m3-climate-card
            config_version: 1
            title: Temperature
            grid_options:
              columns: full
              rows: auto
            entities:
              room_temperature: sensor.example_temperature
              target_temperature: input_number.example_target
              enabled: input_boolean.example_climate
            presets: []
      - type: grid
        column_span: 2
        cards:
          - type: custom:ha-m3-camera-card
            entity: camera.example
            name: Entrance
            grid_options:
              columns: full
              rows: auto
          - type: custom:ha-m3-device-card
            entity: climate.example
            name: Air conditioner
            icon: ac_unit
            grid_options:
              columns: full
              rows: auto
  - title: Rooms
    path: rooms
    type: sections
    sections:
      - type: grid
        cards:
          - type: button
            name: Example room
            icon: mdi:door
            tap_action:
              action: navigate
              navigation_path: /your-dashboard/example-room
  - title: Cameras
    path: cameras
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:ha-m3-camera-card
            entity: camera.example
            name: Entrance
            grid_options:
              columns: full
              rows: auto
  - title: Example room
    path: example-room
    subview: true
    back_path: /your-dashboard/rooms
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:ha-m3-device-card
            entity: fan.example
            name: Purifier
            icon: mode_fan
            expanded: true
            grid_options:
              columns: full
              rows: auto
