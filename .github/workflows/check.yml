name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m pip install -r tests/controller/requirements.txt
      - run: npm run check
      - name: Verify committed distribution is reproducible
        run: git diff --exit-code -- dist themes
      - run: python3 scripts/package.py
      - run: python3 scripts/stage-hacs-release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ha-material3
          path: release/*.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: controller-test-report
          path: controller-test-report.json
