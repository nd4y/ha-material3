name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m pip install -r tests/controller/requirements.txt
      - run: npm run check
      - name: Verify committed distribution is reproducible
        run: git diff --exit-code -- dist themes
      - run: python3 scripts/package.py
      - run: python3 scripts/stage-hacs-release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ha-material3
          path: release/*.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: controller-test-report
          path: controller-test-report.json
  journal-browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --prefix /tmp/m3-browser-tools --no-save --no-package-lock playwright-core@1.64.0
      - run: node scripts/test-journal-browser.mjs "$GITHUB_WORKSPACE" /tmp/m3-browser-tools
      - run: node scripts/test-history-browser.mjs "$GITHUB_WORKSPACE" /tmp/m3-browser-tools
      - run: node scripts/test-sensors-browser.mjs "$GITHUB_WORKSPACE" /tmp/m3-browser-tools
      - run: node scripts/test-mobile-browser.mjs "$GITHUB_WORKSPACE" /tmp/m3-browser-tools
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: owner-controls-mobile
          path: owner-controls-mobile.png
      - run: node scripts/test-hold-browser.mjs "$GITHUB_WORKSPACE" /tmp/m3-browser-tools
      - run: node scripts/test-unified-browser.mjs "$GITHUB_WORKSPACE" /tmp/m3-browser-tools
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unified-browser-report
          path: |
            unified-browser-report.json
            unified-browser-artifacts/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hold-browser-report
          path: |
            hold-browser-report.json
            hold-public-mobile.png
            hold-progress-mobile.png
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mobile-browser-report
          path: mobile-browser-report.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sensors-browser-report
          path: sensors-browser-report.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: journal-browser-report
          path: journal-browser-report.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: history-browser-report
          path: history-browser-report.json
