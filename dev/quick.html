<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="darkreader-lock"><title>M3 quick controls lab</title><style>body{margin:0;background:#101113;color:#e3e5e9;font:14px/20px Arial,sans-serif}main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;padding:20px;max-width:1100px;margin:auto}.stack{display:grid;gap:16px;align-content:start;min-width:0}header,footer{padding:16px 20px;max-width:1100px;margin:auto}h1{font-size:24px;font-weight:500}button,select{padding:10px;font:inherit}#log{white-space:pre-wrap;font-size:12px}@media(max-width:750px){main{grid-template-columns:1fr;padding:12px}}</style></head><body><header><h1>Кабинет - быстрые настройки</h1><p>Локальные демонстрационные сущности</p><label>Проверка <select id="condition"><option value="normal">Обычная работа</option><option value="error">Ошибка команды</option><option value="unavailable">Недоступный прибор</option></select></label></header><main><div class="stack" id="devices"></div><div class="stack" id="summary"></div></main><footer><div id="log" role="status">Команд: 0</div></footer><script type="module" src="/quick-demo.js"></script></body></html>
