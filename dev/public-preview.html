<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material 3 - публичная демонстрация</title><style>body{margin:0;background:var(--primary-background-color,#101317);color:var(--primary-text-color,#e3e9f1);font:14px/20px Arial,sans-serif}header,main,footer{max-width:1440px;margin:auto;padding:16px 24px;box-sizing:border-box}header{padding-bottom:0}h1{font-size:22px;font-weight:500;margin:8px 0}p{color:var(--secondary-text-color,#bec7d2);margin:4px 0}main{display:grid;gap:16px}#devices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}#journal{max-width:none}footer{font-size:12px}#condition,#log{display:none}@media(max-width:750px){header,main,footer{padding-left:12px;padding-right:12px}#devices{grid-template-columns:1fr}}</style></head><body><header><h1>Дом</h1><p>Демонстрационные данные. Устройства не подключены.</p></header><select id="condition"><option value="normal">normal</option><option value="error">error</option><option value="unavailable">unavailable</option></select><main><div id="summary"></div><div id="devices"></div><div id="journal"></div></main><footer>Автономная публичная демонстрация - без камеры и данных реального дома.</footer><div id="log"></div><script type="module" src="/public-preview.js"></script></body></html>
