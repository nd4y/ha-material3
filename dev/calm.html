<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ice - isolated HA fixture</title><style>body{margin:0;background:var(--primary-background-color,#101317);color:var(--primary-text-color,#e3e9f1);font:14px/20px Arial,sans-serif}header,main,footer{max-width:1280px;margin:auto;padding:16px}h1{font-size:20px}#devices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}main{display:grid;gap:16px}#journal{max-width:620px}#log{overflow-wrap:anywhere}select{font:inherit;padding:8px}@media(max-width:850px){#devices{grid-template-columns:1fr}}@media(max-width:400px){header,main,footer{padding:8px}}</style></head><body><header><h1>Лёд - тестовый стенд</h1><p>Демонстрационные данные. Устройства не подключены.</p><label>Проверка <select id="condition"><option value="normal">Обычная работа</option><option value="error">Ошибка команды</option><option value="unavailable">Недоступный прибор</option></select></label></header><main><div id="summary"></div><div id="devices"></div><div id="journal"></div></main><footer id="log">Команд: 0</footer><script type="module" src="/calm.js"></script></body></html>
