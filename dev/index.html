<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="darkreader-lock"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HA Material 3 - Development lab</title><style>body{margin:0;background:#0f0d12;color:#eae3ef;font:14px/20px Arial,sans-serif}body>header{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid #4a4650}body>header h1{font-size:16px;margin:0}body>header label{display:flex;align-items:center;gap:8px}select,button{font:inherit;padding:12px;min-height:48px;background:#27242d;color:#eae3ef;border:1px solid #78737e;border-radius:8px}pre{white-space:pre-wrap;padding:16px;font-size:13px}#audit[hidden]{display:none}footer{padding:16px;border-top:1px solid #4a4650}.notice{color:#aea9b4}ha-m3-dashboard{min-height:900px}</style></head><body>
<header><h1>Локальный стенд Material 3</h1><span class="notice">Реальные устройства не подключены</span><label>Состояние<select id="scenario"><option value="normal">Обычное</option><option value="maximum">Максимум</option><option value="unavailable">Недоступно</option><option value="error">Ошибка команды</option><option value="loading">Загрузка команды</option><option value="long">Длинные названия</option></select></label><label>Тема<select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label><label>Движение<select id="motion"><option value="expressive">Expressive</option><option value="reduced">Уменьшенное</option></select></label><button id="audit-button" type="button">Проверить доступность</button></header>
<ha-m3-dashboard id="panel"></ha-m3-dashboard>
<footer><div id="calls" aria-live="polite">Команд: 0</div><button id="duplicate-button" type="button">Проверить повторное подключение</button><p id="duplicate-result" role="status"></p><pre id="audit" hidden role="status"></pre></footer>
<script src="/axe.min.js"></script><script type="module" src="/demo.js"></script></body></html>
