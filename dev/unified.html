<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified panel component acceptance fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--primary-background-color,#101317);color:var(--primary-text-color,#e3e9f1);font:14px/20px 'HA M3 Roboto',Arial,sans-serif}header,main{max-width:1440px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:22px;line-height:28px}header span{font-size:12px;color:var(--secondary-text-color)}main{display:grid;gap:12px;padding-bottom:112px}.secondary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}#devices,#summary,#journal,#sensors,#camera,#standard-device,#primitives{min-width:0}#condition,#log{display:none}.primitive-grid{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.primitive-section{background:var(--card-background-color);border-radius:24px;padding:12px;min-width:0}.primitive-section>h2{font-size:16px;line-height:24px;margin:0 0 8px}.sample-label{font-size:14px}#fixture-end{font-size:12px} @media(max-width:700px){.secondary{grid-template-columns:minmax(0,1fr)}header{align-items:flex-start}header span{max-width:130px;text-align:right}}
</style></head><body>
<header><h1>Единая панель</h1><span>Только демонстрационные данные</span></header>
<select id="condition"><option value="normal">normal</option><option value="error">error</option><option value="unavailable">unavailable</option></select><div id="log"></div>
<main><div id="summary"></div><div id="devices"></div><div class="secondary"><div id="camera"></div><div id="sensors"></div><div id="standard-device"></div><div id="primitives"></div></div><div id="journal"></div><div id="fixture-end">Конец панели</div></main>
<script type="module" src="/unified-demo.js"></script></body></html>
